name: Python quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.5"
          args: check .

      - name: Check Python formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.5"
          args: format --check .
